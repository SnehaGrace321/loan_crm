<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Loan CRM - Mobile Admin Login</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #e9edf2;
            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* MOBILE LOGIN APP */

        .mobile-login {
            width: 100%;
            max-width: 430px;
            min-height: 100vh;

            background: #f7f8fa;

            position: relative;
            overflow: hidden;
        }

        /* HEADER */

        .login-header {
            background: #0d6efd;
            color: white;

            padding: 55px 30px 45px;

            border-radius: 0 0 32px 32px;
        }

        .login-icon {
            width: 65px;
            height: 65px;

            background: rgba(255,255,255,0.18);

            border-radius: 18px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 32px;
        }

        .login-header h2 {
            font-weight: 700;
        }

        .login-header p {
            opacity: 0.9;
        }

        /* LOGIN BODY */

        .login-body {
            padding: 35px 28px;
        }

        .login-title {
            font-weight: 700;
            font-size: 24px;
        }

        .login-subtitle {
            color: #6c757d;
            font-size: 14px;
        }

        /* FORM */

        .form-label {
            font-size: 13px;
            font-weight: 600;
        }

        .form-control {
            border-radius: 12px;
            padding: 13px 14px;

            border: 1px solid #dee2e6;
        }

        .form-control:focus {
            box-shadow: 0 0 0 3px rgba(13,110,253,0.12);
            border-color: #0d6efd;
        }

        /* LOGIN BUTTON */

        .login-btn {
            width: 100%;

            border-radius: 12px;

            padding: 13px;

            font-weight: 600;

            font-size: 15px;
        }

        /* ERROR */

        .alert {
            border-radius: 12px;
            font-size: 13px;
        }

        /* FOOTER */

        .login-footer {
            text-align: center;

            color: #8a8f98;

            font-size: 11px;

            margin-top: 25px;
        }

        /* DESKTOP PREVIEW */

        @media (min-width: 500px) {

            body {
                padding: 20px;
            }

            .mobile-login {
                min-height: 90vh;

                border-radius: 28px;

                box-shadow:
                    0 5px 30px rgba(0,0,0,0.15);
            }

        }

    </style>

</head>

<body>


<div class="mobile-login">


    <!-- ========================= -->
    <!-- HEADER -->
    <!-- ========================= -->

    <div class="login-header">

        <div class="login-icon">

            <i class="bi bi-bank"></i>

        </div>


        <h2 class="mt-4 mb-1">
            Loan CRM
        </h2>


        <p class="mb-0">
            Mobile Admin Portal
        </p>

    </div>


    <!-- ========================= -->
    <!-- LOGIN BODY -->
    <!-- ========================= -->

    <div class="login-body">


        <h3 class="login-title">
            Admin Login
        </h3>


        <p class="login-subtitle mb-4">
            Sign in to manage your Loan CRM.
        </p>


        <!-- ERROR MESSAGE -->

        {% if error %}

        <div class="alert alert-danger">

            <i class="bi bi-exclamation-circle me-1"></i>

            {{ error }}

        </div>

        {% endif %}


        <!-- LOGIN FORM -->

        <form method="POST">


            <!-- EMAIL -->

            <div class="mb-3">

                <label class="form-label">
                    Email
                </label>


                <div class="input-group">

                    <span class="input-group-text bg-white">

                        <i class="bi bi-envelope"></i>

                    </span>


                    <input
                        type="email"
                        name="email"
                        class="form-control"
                        placeholder="Admin email"
                        autocomplete="email"
                        required>

                </div>

            </div>


            <!-- PASSWORD -->

            <div class="mb-4">

                <label class="form-label">
                    Password
                </label>


                <div class="input-group">

                    <span class="input-group-text bg-white">

                        <i class="bi bi-lock"></i>

                    </span>


                    <input
                        type="password"
                        name="password"
                        class="form-control"
                        placeholder="Password"
                        autocomplete="current-password"
                        required>

                </div>

            </div>


            <!-- LOGIN BUTTON -->

            <button
                type="submit"
                class="btn btn-primary login-btn">

                <i class="bi bi-box-arrow-in-right me-2"></i>

                Login

            </button>


        </form>


        <!-- FOOTER -->

        <div class="login-footer">

            <i class="bi bi-shield-check me-1"></i>

            Secure Admin Access

        </div>


    </div>


</div>


<!-- Bootstrap JS -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


</body>

</html>
