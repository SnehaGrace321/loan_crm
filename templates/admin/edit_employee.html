{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>
            <h2>Edit Employee</h2>

            <p class="text-muted">
                Update employee details and access.
            </p>
        </div>

        <a href="{{ url_for('employees') }}"
           class="btn btn-outline-primary">

            ← Back to Employees

        </a>

    </div>


    <div class="card shadow-sm border-0">

        <div class="card-body">

            <form method="POST">

                <div class="mb-3">

                    <label class="form-label">
                        Employee Name
                    </label>

                    <input type="text"
                           name="name"
                           class="form-control"
                           value="{{ employee.name }}"
                           required>

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Email
                    </label>

                    <input type="email"
                           name="email"
                           class="form-control"
                           value="{{ employee.email }}"
                           required>

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Daily Call Target
                    </label>

                    <input type="number"
                           name="daily_target"
                           class="form-control"
                           value="{{ employee.daily_target }}"
                           min="1"
                           required>

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Status
                    </label>

                    <select name="status"
                            class="form-select">

                        <option value="active"
                            {% if employee.status == "active" %}
                                selected
                            {% endif %}>
                            Active
                        </option>

                        <option value="inactive"
                            {% if employee.status == "inactive" %}
                                selected
                            {% endif %}>
                            Inactive
                        </option>

                    </select>

                </div>


                <button type="submit"
                        class="btn btn-primary">

                    <i class="bi bi-check-circle"></i>
                    Save Changes

                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}
