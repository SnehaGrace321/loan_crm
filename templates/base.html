<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Loan CRM{% endblock %}</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet"
    >

    <!-- Custom CSS -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">

        <a class="navbar-brand fw-bold" href="#">
            <i class="bi bi-bank"></i>
            Loan CRM
        </a>

        {% if session.get('user_id') %}

        <div class="d-flex align-items-center text-white">

            <span class="me-3">
                <i class="bi bi-person-circle"></i>
                {{ session.get('name') }}
            </span>

            <a href="{{ url_for('logout') }}"
               class="btn btn-outline-light btn-sm">
                <i class="bi bi-box-arrow-right"></i>
                Logout
            </a>

        </div>

        {% endif %}

    </div>
</nav>


<div class="container-fluid">

    <div class="row">

        {% if session.get('role') == 'admin' %}

        <!-- Admin Sidebar -->
        <aside class="col-md-2 bg-dark text-white min-vh-100 p-3">

            <h6 class="text-uppercase text-secondary mb-3">
                Admin Portal
            </h6>

            <div class="nav flex-column">

                <a href="{{ url_for('dashboard') }}"
                   class="nav-link text-white">
                    <i class="bi bi-speedometer2 me-2"></i>
                    Dashboard
                </a>

                <a href="{{ url_for('leads') }}"
                   class="nav-link text-white">
                    <i class="bi bi-people me-2"></i>
                    Leads
                </a>

                <a href="{{ url_for('bulk_upload') }}"
                   class="nav-link text-white">
                    <i class="bi bi-upload me-2"></i>
                    Bulk Upload
                </a>

                <a href="{{ url_for('employees') }}"
                   class="nav-link text-white">
                    <i class="bi bi-person-badge me-2"></i>
                    Employees
                </a>

                <a href="{{ url_for('banks') }}"
                   class="nav-link text-white">
                    <i class="bi bi-bank me-2"></i>
                    Banks & Schemes
                </a>

                <hr>

                <a href="#" class="nav-link text-white">
                    <i class="bi bi-file-earmark-text me-2"></i>
                    Loan Applications
                </a>

                <a href="#" class="nav-link text-white">
                    <i class="bi bi-folder-check me-2"></i>
                    Documents
                </a>

                <a href="#" class="nav-link text-white">
                    <i class="bi bi-calendar-check me-2"></i>
                    Follow-ups
                </a>

                <a href="#" class="nav-link text-white">
                    <i class="bi bi-bar-chart me-2"></i>
                    Reports
                </a>

            </div>

        </aside>

        {% endif %}


        <!-- Main Content -->
        <main class="{% if session.get('role') == 'admin' %}col-md-10{% else %}col-md-12{% endif %} p-4">

            {% block content %}
            {% endblock %}

        </main>

    </div>

</div>


<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Custom JS -->
<script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>
</html>
