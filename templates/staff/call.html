{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>
            <h2>Customer Call</h2>
            <p class="text-muted">
                Record call details for this customer
            </p>
        </div>

        <a href="{{ url_for('staff_leads') }}"
           class="btn btn-outline-primary">

            <i class="bi bi-arrow-left"></i>
            Back to My Leads

        </a>

    </div>


    <!-- Customer Details -->

    <div class="card shadow-sm border-0 mb-4">

        <div class="card-body">

            <h5 class="card-title">
                {{ lead.customer_name }}
            </h5>

            <div class="row mt-3">

                <div class="col-md-4">
                    <strong>Phone</strong>
                    <p>{{ lead.phone }}</p>
                </div>

                <div class="col-md-4">
                    <strong>City</strong>
                    <p>{{ lead.city }}</p>
                </div>

                <div class="col-md-4">
                    <strong>Loan Type</strong>
                    <p>{{ lead.loan_type }}</p>
                </div>

            </div>

        </div>

    </div>


    <!-- Call Form -->

    <div class="card shadow-sm border-0">

        <div class="card-body">

            <h5 class="mb-4">Call Details</h5>

            <form method="POST">

                <!-- Call Status -->

                <div class="mb-3">

                    <label class="form-label">
                        Call Status
                    </label>

                    <select name="call_status"
                            class="form-select"
                            required>

                        <option value="">
                            Select Call Status
                        </option>

                        <option value="connected">
                            Connected
                        </option>

                        <option value="not_connected">
                            Not Connected
                        </option>

                        <option value="busy">
                            Busy
                        </option>

                        <option value="switched_off">
                            Switched Off
                        </option>

                    </select>

                </div>


                <!-- Interest Status -->

                <div class="mb-3">

                    <label class="form-label">
                        Customer Interest
                    </label>

                    <select name="interest_status"
                            class="form-select"
                            required>

                        <option value="">
                            Select Interest
                        </option>

                        <option value="interested">
                            Interested
                        </option>

                        <option value="not_interested">
                            Not Interested
                        </option>

                        <option value="follow_up">
                            Follow-up
                        </option>

                        <option value="pending">
                            Pending
                        </option>

                    </select>

                </div>


                <!-- Remarks -->

                <div class="mb-3">

                    <label class="form-label">
                        Remarks
                    </label>

                    <textarea name="remarks"
                              class="form-control"
                              rows="4"
                              placeholder="Enter call remarks..."
                              required></textarea>

                </div>
                
             <!-- follow up date -->

                <div class="mb-3">
                    <label for="follow_up_date" class="form-label">
                        Follow-up Date
                    </label>

                    <input type="date"
                        name="follow_up_date"
                        id="follow_up_date"
                        class="form-control">
                </div>


                <button type="submit"
                        class="btn btn-success">

                    <i class="bi bi-check-circle"></i>
                    Save Call

                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}
